<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Compressible flow around a wing</title>
  <desc id="desc">Blue and teal streamlines bend around a white wing profile, with warm pressure regions near the leading and trailing edges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#fff"/><stop offset=".5" stop-color="#f1f6ff"/><stop offset="1" stop-color="#dce9ff"/></linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a85ec" stop-opacity=".2"/><stop offset=".35" stop-color="#1261da"/><stop offset=".72" stop-color="#17a5d1"/><stop offset="1" stop-color="#0b67cb" stop-opacity=".28"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="900" height="500" rx="28" fill="url(#bg)"/>
